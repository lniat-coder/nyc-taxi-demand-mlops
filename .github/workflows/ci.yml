name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -e .
      # unit + integration tests: synthetic data, throwaway MLflow, no secret, no network
      - run: pytest -q

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus rules and config are valid
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v3.0.0 check rules /m/alert_rules.yml
      - name: API image builds
        run: docker build -f docker/api.Dockerfile -t nyc-taxi-api:ci .
      - name: DVC pipeline is well formed
        run: pip install dvc==3.67.1 && dvc dag
